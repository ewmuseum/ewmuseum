#
# ############################################################################
# #                                                                          #
# #   NOT ACTIVE. This workflow does not run on push, and will not deploy    #
# #   anything until the Janitor arms it. It is the R2 deploy path, built    #
# #   and tested ahead of the migration, sitting here ready.                 #
# #                                                                          #
# ############################################################################
#
# THE MUSEUM — deploy the served tree to R2 (the successor to ci.yml's
# `deploy` job, which pushes to Cloudflare Pages).
#
# WHY IT EXISTS: Cloudflare Pages caps a deploy at 20,000 files. The museum is
# past 15,600 and grows by hundreds per accession wave. R2 has no ceiling.
# `scripts/r2-sync.mjs` mirrors the tree into the bucket incrementally and
# `worker/index.mjs` serves it, carrying the invite gate and the `_headers`
# policy across unchanged. The full story, and the Janitor's step-by-step, is
# in docs/OPERATIONS.md's "R2 MIGRATION" section.
#
# ---------------------------------------------------------------------------
# THREE THINGS KEEP THIS INERT, and all three must be undone deliberately:
#
#   1. There is no `push:` trigger. Only `workflow_dispatch` — someone has to
#      go to the Actions tab and press the button.
#   2. Even then, every step is gated on the repository VARIABLE `R2_DEPLOY`
#      being exactly "true" (Settings -> Secrets and variables -> Actions ->
#      Variables). Until that variable exists, a dispatched run does nothing
#      but print why.
#   3. The dispatch form itself asks for a typed confirmation.
#
# TO ARM IT, at cutover, in this order:
#   a. Set the `R2_DEPLOY` repository variable to `true`.
#   b. Dispatch this workflow once with `dry_run: true` and read the diff.
#   c. Dispatch again with `dry_run: false`.
#   d. Only once the Worker's route is live and the site is verified, disable
#      ci.yml's own `deploy` job (Pages) — NOT before. Two deploy paths running
#      at once is the safe state during cutover, not a problem to fix.
#   e. When this is the only deploy path, uncomment the `push:` trigger below
#      and delete the `workflow_dispatch` confirmation input.
#
# TO DISARM IT: delete the `R2_DEPLOY` variable. That is the whole rollback of
# this file; the Pages path in ci.yml is untouched by any of it.
# ---------------------------------------------------------------------------

name: Deploy to R2 (NOT ACTIVE)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you mean to sync the museum to R2'
        required: true
        default: ""
      dry_run:
        description: "Print the diff and change nothing"
        type: boolean
        required: true
        default: true

  # ---- CUTOVER: uncomment to make R2 the automatic deploy path -------------
  # Mirrors ci.yml's own trigger. Do NOT uncomment while ci.yml's `deploy` job
  # is still pushing to Pages unless you actually want both — during cutover
  # you probably do; afterwards you certainly do not.
  #
  # push:
  #   branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    # The secrets context is not legal in an `if:` condition — map to env and
    # gate on that instead. This is the same pattern ci.yml's deploy job and
    # mirror.yml's mirror steps both use, and it exists because the naive
    # version silently never runs. See docs/OPERATIONS.md, Mirrors section, for
    # the incident that taught it.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_DEPLOY: ${{ vars.R2_DEPLOY }}

    steps:
      - name: Refuse unless deliberately armed
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::notice::Not confirmed — the dispatch form needs the word \"deploy\". Nothing was done."
            exit 1
          fi
          if [ "$R2_DEPLOY" != "true" ]; then
            echo "::notice::The R2_DEPLOY repository variable is not \"true\". This workflow is NOT ACTIVE by design."
            echo "::notice::See docs/OPERATIONS.md, section \"R2 MIGRATION\", for how and when to arm it."
            exit 1
          fi
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same gate every push already runs. A deploy of an invalid site is
      # worse than no deploy: the museum stays up but starts lying.
      - name: Validate the static site
        run: npm run check

      # The Worker serves the `_headers` policy from a build-time bake. If the
      # bake lags `_headers` — a new memorial stamped into the clacks block,
      # say — the header on the wire would silently be the old one.
      # r2-sync refuses to run in that state too; this fails earlier and louder.
      - name: Check the Worker's baked _headers are current
        run: npm run worker:headers:check

      - name: Sync the tree to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/r2-sync.mjs --dry-run
          else
            node scripts/r2-sync.mjs --yes --concurrency 12
          fi

      # Deploying the Worker is separate from syncing the tree, and usually
      # unnecessary: the Worker's code changes rarely, the tree changes every
      # wave. It runs here only when `_headers` moved, since that is baked into
      # the Worker bundle rather than read from the bucket.
      - name: Redeploy the Worker if its baked headers changed
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep -qE '^(worker/|_headers$)'; then
            npx --yes wrangler deploy -c worker/wrangler.toml
          else
            echo "Worker source and _headers unchanged — bucket sync only."
          fi
